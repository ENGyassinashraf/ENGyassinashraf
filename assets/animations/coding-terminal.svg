<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" aria-labelledby="title desc">
  <title id="title">Animated C-sharp coding terminal</title>
  <desc id="desc">A compact code editor where a C-sharp API controller example is progressively revealed, with a blinking cursor.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101c29"/><stop offset="1" stop-color="#0b131e"/></linearGradient>
    <clipPath id="code1"><rect x="73" y="60" width="0" height="24"><animate attributeName="width" values="0;130;130;0" keyTimes="0;0.18;0.85;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="code2"><rect x="73" y="87" width="0" height="24"><animate attributeName="width" values="0;173;173;0" keyTimes="0;0.18;0.85;1" dur="10s" begin="0.22s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="code3"><rect x="73" y="114" width="0" height="24"><animate attributeName="width" values="0;465;465;0" keyTimes="0;0.18;0.85;1" dur="10s" begin="0.44s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="code4"><rect x="73" y="141" width="0" height="24"><animate attributeName="width" values="0;15;15;0" keyTimes="0;0.18;0.85;1" dur="10s" begin="0.66s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="code5"><rect x="107" y="168" width="0" height="24"><animate attributeName="width" values="0;84;84;0" keyTimes="0;0.18;0.85;1" dur="10s" begin="0.88s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="code6"><rect x="107" y="195" width="0" height="24"><animate attributeName="width" values="0;355;355;0" keyTimes="0;0.18;0.85;1" dur="10s" begin="1.1s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="code7"><rect x="73" y="222" width="0" height="24"><animate attributeName="width" values="0;15;15;0" keyTimes="0;0.18;0.85;1" dur="10s" begin="1.32s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect x="1" y="1" width="898" height="284" rx="15" fill="url(#panel)" stroke="#2a4051" stroke-width="1.5"/>
  <path d="M1 16 Q1 1 16 1 H884 Q899 1 899 16 V43 H1 Z" fill="#172635"/>
  <circle cx="22" cy="22" r="5" fill="#f77676"/><circle cx="40" cy="22" r="5" fill="#eabf6a"/><circle cx="58" cy="22" r="5" fill="#58c99a"/>
  <text x="82" y="27" fill="#c5d7e2" font-family="Arial, Helvetica, sans-serif" font-size="12">TasksController.cs</text>
  <rect x="755" y="10" width="123" height="24" rx="6" fill="#102f3c" stroke="#24556a"/>
  <circle cx="769" cy="22" r="3" fill="#43d1c3"><animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/></circle>
  <text x="780" y="26" fill="#91dce4" font-family="Arial, Helvetica, sans-serif" font-size="10">C# · API CONTROLLER</text>
  <line x1="55" y1="44" x2="55" y2="285" stroke="#223544"/>
  <rect x="67" y="196" width="808" height="24" rx="4" fill="#163245" opacity="0.5"/>
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" opacity="0.47">
    <g fill="#627d90" text-anchor="end"><text x="42" y="78">1</text><text x="42" y="105">2</text><text x="42" y="132">3</text><text x="42" y="159">4</text><text x="42" y="186">5</text><text x="42" y="213">6</text><text x="42" y="240">7</text></g>
    <text x="76" y="78" fill="#c792ea">[ApiController]</text>
    <text x="76" y="105" fill="#c792ea">[Route(<tspan fill="#a8d8a8">"api/tasks"</tspan>)]</text>
    <text x="76" y="132" fill="#89c4f4">public sealed class <tspan fill="#e4ecf3">TasksController</tspan> : <tspan fill="#f0c674">ControllerBase</tspan></text>
    <text x="76" y="159" fill="#e4ecf3">{</text>
    <text x="110" y="186" fill="#c792ea">[HttpGet]</text>
    <text x="110" y="213" fill="#89c4f4">public IActionResult <tspan fill="#e4ecf3">Get()</tspan> =&gt; <tspan fill="#f0c674">Ok</tspan>(_tasks);</text>
    <text x="76" y="240" fill="#e4ecf3">}</text>
  </g>
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14">
    <g clip-path="url(#code1)"><text x="76" y="78" fill="#c792ea">[ApiController]</text></g>
    <g clip-path="url(#code2)"><text x="76" y="105" fill="#c792ea">[Route(<tspan fill="#a8d8a8">"api/tasks"</tspan>)]</text></g>
    <g clip-path="url(#code3)"><text x="76" y="132" fill="#89c4f4">public sealed class <tspan fill="#e4ecf3">TasksController</tspan> : <tspan fill="#f0c674">ControllerBase</tspan></text></g>
    <g clip-path="url(#code4)"><text x="76" y="159" fill="#e4ecf3">{</text></g>
    <g clip-path="url(#code5)"><text x="110" y="186" fill="#c792ea">[HttpGet]</text></g>
    <g clip-path="url(#code6)"><text x="110" y="213" fill="#89c4f4">public IActionResult <tspan fill="#e4ecf3">Get()</tspan> =&gt; <tspan fill="#f0c674">Ok</tspan>(_tasks);</text></g>
    <g clip-path="url(#code7)"><text x="76" y="240" fill="#e4ecf3">}</text></g>
  </g>
  <rect x="463" y="198" width="7" height="17" rx="1" fill="#49c7d9"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="859" y="268" text-anchor="end" fill="#567387" font-family="Arial, Helvetica, sans-serif" font-size="10">BUILDING API LOGIC</text>
</svg>