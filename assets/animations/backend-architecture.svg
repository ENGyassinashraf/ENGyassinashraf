<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="238" viewBox="0 0 1000 238" role="img" aria-labelledby="title desc">
  <title id="title">Animated back-end architecture flow</title>
  <desc id="desc">A client request moves through an ASP.NET Core API, application services, Entity Framework Core, and SQL Server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#101e2b"/></linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b50"/><stop offset="1" stop-color="#122a3b"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#6e9aaf"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="236" rx="18" fill="url(#bg)" stroke="#263b4b" stroke-width="1.5"/>
  <text x="26" y="32" fill="#e5f2f8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">BACK-END REQUEST FLOW</text>
  <text x="26" y="53" fill="#8ba5b8" font-family="Arial, Helvetica, sans-serif" font-size="12">A request moving through a layered .NET API</text>
  <path d="M178 132 H211 M393 132 H422 M604 132 H632 M787 132 H814" fill="none" stroke="#46687d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M178 132 H211 M393 132 H422 M604 132 H632 M787 132 H814" fill="none" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 11" opacity="0.95">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <rect x="24" y="83" width="154" height="99" rx="12" fill="#111f2c" stroke="#355267"/>
      <circle cx="101" cy="111" r="14" fill="#17374a" stroke="#4e90ad"/>
      <rect x="94" y="105" width="14" height="10" rx="2" fill="none" stroke="#b5e9f9" stroke-width="1.5"/>
      <path d="M97 118 H105 M101 115 V118" stroke="#b5e9f9" stroke-width="1.5" stroke-linecap="round"/>
      <text x="101" y="146" fill="#e8f3f8" font-size="14" font-weight="700">Client</text>
      <text x="101" y="163" fill="#88a7ba" font-size="11">HTTP request</text>
    </g>
    <g>
      <rect x="212" y="83" width="181" height="99" rx="12" fill="url(#api)" stroke="#2ab8cf" stroke-width="1.5"/>
      <rect x="281" y="97" width="42" height="27" rx="5" fill="#0b2432" stroke="#47c6dc"/>
      <path d="M292 105 L286 110.5 L292 116 M312 105 L318 110.5 L312 116 M306 103 L298 118" fill="none" stroke="#d0f7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="302.5" y="146" fill="#f0fcff" font-size="13.5" font-weight="700">ASP.NET Core API</text>
      <text x="302.5" y="163" fill="#9ddcea" font-size="11">Controllers · REST</text>
      <rect x="217" y="88" width="171" height="89" rx="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25">
        <animate attributeName="opacity" values="0.12;0.4;0.12" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="423" y="83" width="181" height="99" rx="12" fill="#111f2c" stroke="#355267"/>
      <circle cx="513.5" cy="110.5" r="14" fill="#17374a" stroke="#4e90ad"/>
      <rect x="505" y="103" width="17" height="5" rx="1.5" fill="none" stroke="#b5e9f9" stroke-width="1.4"/>
      <rect x="505" y="111" width="17" height="5" rx="1.5" fill="none" stroke="#b5e9f9" stroke-width="1.4"/>
      <text x="513.5" y="146" fill="#e8f3f8" font-size="13.5" font-weight="700">Application Services</text>
      <text x="513.5" y="163" fill="#88a7ba" font-size="11">Business logic</text>
    </g>
    <g>
      <rect x="633" y="83" width="154" height="99" rx="12" fill="#111f2c" stroke="#355267"/>
      <circle cx="710" cy="110.5" r="14" fill="#17374a" stroke="#4e90ad"/>
      <ellipse cx="710" cy="105" rx="7.5" ry="3" fill="none" stroke="#b5e9f9" stroke-width="1.3"/>
      <path d="M702.5 105 V116 C702.5 120 717.5 120 717.5 116 V105 M702.5 110 C702.5 114 717.5 114 717.5 110" fill="none" stroke="#b5e9f9" stroke-width="1.3"/>
      <text x="710" y="146" fill="#e8f3f8" font-size="14" font-weight="700">EF Core</text>
      <text x="710" y="163" fill="#88a7ba" font-size="11">Data access</text>
    </g>
    <g>
      <rect x="815" y="83" width="161" height="99" rx="12" fill="#111f2c" stroke="#355267"/>
      <circle cx="895.5" cy="110.5" r="14" fill="#17374a" stroke="#4e90ad"/>
      <ellipse cx="895.5" cy="104.5" rx="8" ry="3.2" fill="none" stroke="#b5e9f9" stroke-width="1.3"/>
      <path d="M887.5 104.5 V116 C887.5 120.5 903.5 120.5 903.5 116 V104.5 M887.5 110.5 C887.5 115 903.5 115 903.5 110.5" fill="none" stroke="#b5e9f9" stroke-width="1.3"/>
      <text x="895.5" y="146" fill="#e8f3f8" font-size="14" font-weight="700">SQL Server</text>
      <text x="895.5" y="163" fill="#88a7ba" font-size="11">Relational data</text>
    </g>
  </g>
  <g fill="#baf7ff">
    <circle r="3.5"><animateMotion dur="0.85s" repeatCount="indefinite" path="M178 132 H211"/><animate attributeName="opacity" values="0.15;1;0.15" dur="0.85s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="0.85s" begin="0.45s" repeatCount="indefinite" path="M393 132 H422"/><animate attributeName="opacity" values="0.15;1;0.15" dur="0.85s" begin="0.45s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="0.85s" begin="0.9s" repeatCount="indefinite" path="M604 132 H632"/><animate attributeName="opacity" values="0.15;1;0.15" dur="0.85s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="0.85s" begin="1.35s" repeatCount="indefinite" path="M787 132 H814"/><animate attributeName="opacity" values="0.15;1;0.15" dur="0.85s" begin="1.35s" repeatCount="indefinite"/></circle>
  </g>
  <text x="974" y="215" text-anchor="end" fill="#5f8195" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="0.6">REQUEST  →  DATA</text>
</svg>