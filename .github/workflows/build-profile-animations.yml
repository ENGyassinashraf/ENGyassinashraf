name: Build profile animation GIFs

on:
  push:
    branches:
      - profile-animations-preview
    paths:
      - "render_profile_animations.py"
      - ".github/workflows/build-profile-animations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: profile-animations-preview

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Render optimized animated GIFs
        run: python render_profile_animations.py

      - name: Commit GIFs to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animations/*.gif
          if git diff --cached --quiet; then
            echo "No animation output changes."
            exit 0
          fi
          git commit -m "Build animated GIF assets for profile preview"
          git push origin HEAD:profile-animations-preview
